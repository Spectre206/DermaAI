<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DermaAI - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body {
            background-color: #eef2f6;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 2.5rem;
            border-radius: 20px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
            border: 1px solid rgba(0,0,0,0.02);
			transform: scale(0.9);
			transform-origin: center;
        }

        /* Logo Styling */
        .logo-img {
            width: 100px;
            height: 100px;
            margin-bottom: 0.5rem;
            animation: float 6s ease-in-out infinite;
        }

        .welcome-text {
            color: #2563EB;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #e0e0e0;
            background-color: #f8f9fa;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #14B8A6;
            background-color: #fff;
        }

        .btn-primary {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            background: linear-gradient(135deg, #3B82F6 0%, #14B8A6 100%);
            border: none;
            transition: transform 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .text-muted a { color: #3B82F6; text-decoration: none; font-weight: 500; }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="logo.svg" alt="DermaAI Logo" class="logo-img">

        <h4 class="mb-4 welcome-text">Welcome to DermaAI</h4>
        
        <div id="error-alert" class="alert alert-danger d-none text-start p-2 small" role="alert"></div>

        <form id="loginForm">
            <div class="mb-3 text-start">
                <label for="username" class="form-label small text-muted ms-1">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="username" required>
                </div>
            </div>
            
            <div class="mb-4 text-start">
                <label for="password" class="form-label small text-muted ms-1">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 shadow-sm">Sign In</button>
        </form>

        <p class="text-muted mt-4 small">
            Don't have an account? <a href="register.html">Create one</a>
        </p>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/auth/jwt/create/";

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Signing in...';
            btn.disabled = true;

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('error-alert');
            errorAlert.classList.add('d-none');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('accessToken', data.access);
                    localStorage.setItem('refreshToken', data.refresh);
                    window.location.href = 'dashboard.html';
                } else {
                    errorAlert.textContent = "Login failed: " + (data.detail || "Invalid credentials");
                    errorAlert.classList.remove('d-none');
                }
            } catch (error) {
                console.error(error);
                errorAlert.textContent = "Server error. Is Django running?";
                errorAlert.classList.remove('d-none');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
