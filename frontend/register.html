<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DermaAI - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body {
            background-color: #eef2f6;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 2.5rem;
            border-radius: 20px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
			transform: scale(0.9);
			transform-origin: center;
        }
        
        /* Reuse the Logo Styling */
        .logo-img {
            width: 80px; /* Slightly smaller for register page */
            height: 80px;
            margin-bottom: 0.5rem;
            animation: float 6s ease-in-out infinite;
        }

        .welcome-text { color: #2563EB; font-weight: 800; letter-spacing: -0.5px; }
        
        .form-control { border-radius: 10px; padding: 12px; background-color: #f8f9fa; border: 1px solid #e0e0e0; }
        .form-control:focus { box-shadow: none; border-color: #14B8A6; background-color: #fff; }
        
        .btn-primary {
            border-radius: 10px; padding: 12px; font-weight: 600;
            background: linear-gradient(135deg, #3B82F6 0%, #14B8A6 100%);
            border: none;
        }
        .btn-primary:hover { transform: translateY(-2px); opacity: 0.95; }
        
        .text-muted a { color: #3B82F6; text-decoration: none; font-weight: 500; }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="logo.svg" alt="DermaAI Logo" class="logo-img">

        <h4 class="mb-4 welcome-text">Create Account</h4>
        
        <div id="alert-box" class="alert d-none text-start p-2 small" role="alert"></div>

        <form id="registerForm">
            <div class="mb-3 text-start">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="username" placeholder="Username" required>
                </div>
            </div>
            
            <div class="mb-3 text-start">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                    <input type="email" class="form-control border-start-0 ps-0" id="email" placeholder="Email" required>
                </div>
            </div>

            <div class="mb-3 text-start">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="password" placeholder="Password" required>
                </div>
            </div>

            <div class="mb-4 text-start">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-check-circle text-muted"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="re_password" placeholder="Confirm Password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 shadow-sm">Sign Up</button>
        </form>

        <p class="text-muted mt-4 small">
            Already have an account? <a href="login.html">Sign In</a>
        </p>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/auth/users/";

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.querySelector('button[type="submit"]');
            const alertBox = document.getElementById('alert-box');
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const re_password = document.getElementById('re_password').value;

            if(password !== re_password) {
                showAlert('Passwords do not match!', 'danger');
                return;
            }

            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Creating...';
            btn.disabled = true;
            alertBox.classList.add('d-none');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, re_password })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('Account created! Redirecting...', 'success');
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    let errorMsg = "Registration failed.";
                    if(data.username) errorMsg = data.username[0];
                    else if(data.password) errorMsg = data.password[0];
                    else if(data.email) errorMsg = data.email[0];
                    showAlert(errorMsg, 'danger');
                    btn.innerHTML = 'Sign Up';
                    btn.disabled = false;
                }
            } catch (error) {
                console.error(error);
                showAlert('Server error. Check connection.', 'danger');
                btn.innerHTML = 'Sign Up';
                btn.disabled = false;
            }
        });

        function showAlert(msg, type) {
            const alertBox = document.getElementById('alert-box');
            alertBox.className = `alert alert-${type} text-start p-2 small`;
            alertBox.textContent = msg;
            alertBox.classList.remove('d-none');
        }
    </script>
</body>
</html>
